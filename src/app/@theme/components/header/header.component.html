<div>
<div class="d-flex justify-content-start align-items-center" style="padding-right: 0;">
  <div class="col-md-2"></div>
  <div class="col-md-1"> <label style="font-family: Roboto, sans-serif;
  font-size: 0.9375rem;
  font-weight: 400;
  line-height: 1.25rem; padding-top: 7px;">Team :</label> </div>
  <div class="col-md-4" style="width: 340px;">
    <select  class="form-select" aria-label="Default select example" [(ngModel)]="selectedTeam" (change)="changeTeam()">
      <option *ngFor="let team of teamList" [value]="team">{{ team }}</option>
    </select>
</div>
<div class="col-md-1" style=" width: 40px; height: 50px; padding-top: 15px;">
  <div (click)="addFeedback()" style="cursor:pointer;" >
    <span class="material-icons">
      <!-- style="padding-top: 8px;" -->
      sms
      </span>
    <span class="badge" *ngIf="allFeedbackCount != 0">{{ allFeedbackCount }}</span>
  </div>
  </div>
  <div class="col-md-1">
    <button type="button" class="btn btn-outline-link btn-sm" data-toggle="tooltip" data-placement="bottom" [title]="info">
      <i class="fa fa-info-circle fa-lg" aria-hidden="true" style="color: white"></i>
    </button>
  </div>
  <div style="padding-right: 10px; padding-left: 7px; padding-bottom: 5px;">
  <button mat-icon-button [matMenuTriggerFor]="menu"> 
    <i class="fa fa-user-circle fa-2x" style="font-size: 30px !important;"></i> 
     &nbsp; <span style="font-size: 17px !important; position: relative; top: -5px; right: 7px; font-weight: 500">{{user?.name}}</span>
  </button>
  
  <mat-menu #menu style="width: 110px !important;"> 
    <button mat-menu-item  (click)="logout()">
      <span  style="font-size: 12px !important; padding-left: 25px; padding-right: 25px; font-weight: 600;">Log Out</span>
    </button>
  </mat-menu>  
</div>
</div>
</div>
