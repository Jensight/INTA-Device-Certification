<form [formGroup]="feedbackForm" >
  <div class="row">
    <div class="col-lg-11">
      <h6>Feedback Form</h6>
    </div>
    <div class="col-lg-1">
      <span (click)="dialogRef.close()" style="cursor:pointer" class="close" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </span>
    </div>
  </div>

  <div class="form-group">
    <label for="exampleFormControlInput1">Page Name:</label>
    <input type="text" class="form-control" placeholder="Pagename" formControlName="pageName" >
    <span class="text-danger"
        *ngIf="(registerFormControl.pageName.touched || submitted) && registerFormControl.pageName.errors?.required">
        PageName is required
    </span>
  </div>
  <div class="form-group">
    <label for="formControlSelectUsers">Select Users (Optional)</label>
    <ng-multiselect-dropdown formControlName="users"
  [placeholder]="'Select Individual Users'"
  [settings]="dropdownSettings"
  [data]="dropdownList"
>
</ng-multiselect-dropdown>
  </div>
  <div class="form-group">
    <label for="exampleFormControlSelect1">Priority:</label>
    <select class="form-control" formControlName="priority">
      <option>High</option>
      <option>Medium</option>
      <option>Low</option>
    </select>
    <span class="text-danger"
        *ngIf="(registerFormControl.priority.touched || submitted) && registerFormControl.priority.errors?.required">
        Please select Priority.
    </span>
  </div>

  <div class="form-group">
    <label for="exampleFormControlTextarea1">Feedback Description:</label>
    <textarea class="form-control" rows="6" formControlName="feedbackDescription"></textarea>
    <span class="text-danger"
        *ngIf="(registerFormControl.feedbackDescription.touched || submitted) && registerFormControl.feedbackDescription.errors?.required">
        Please enter some Description.
    </span>
  </div>
  <button type="button" class="btn btn-primary pull-right" (click)="onSubmit()">Submit</button>
  <button type="button" class="btn btn-primary pull-left" (click)="onMyFeedback()" >MyFeedback</button>

</form>
