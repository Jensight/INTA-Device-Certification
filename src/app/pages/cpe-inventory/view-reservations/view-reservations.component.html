<div class="d-flex justify-content-end align-items-center mt-2 mr-3" >
    <section style="padding-right: 25px">
        <mat-slide-toggle color="primary" [(ngModel)]="toggleValue" (change)="valueChange()" checked>Active-Reservations</mat-slide-toggle>
    </section>
    <mat-form-field style="padding: 5px;width: 300px;">
        <mat-label>Search Device</mat-label>
        <input matInput type="search" (keyup.enter)="filterSearchResults(searchValue)" [formControl]="searchFormControl" name="searchValue" [(ngModel)]="searchValue" [matAutocomplete]="auto">
        <mat-autocomplete #auto="matAutocomplete">
            <mat-option *ngFor="let device of filteredDevices | async" [value]="device.deviceName" (click)="filterSearchResults(device.deviceName)">
              {{device.deviceName}}
            </mat-option>
        </mat-autocomplete>
        <button mat-button mat-icon-button matSuffix (click)="clearSearchField()" *ngIf="searchValue" style="padding-top: 17px;">
            <mat-icon>clear</mat-icon>
        </button>
    </mat-form-field>
    <button class="primary" type="button" mat-button matSuffix mat-icon-button (click)="filterSearchResults(searchValue)">
        <mat-icon>search</mat-icon>
    </button>
</div>
<div *ngIf="toggleValue">
    <angular2-smart-table (userRowSelect)="rowClicked($event)" (edit)="editResevation($event)" (delete)="cancelReservationConfirmation($event)"
    [source]="source" [settings]="settings"></angular2-smart-table>
</div>
<div *ngIf="!toggleValue">
    <angular2-smart-table (userRowSelect)="rowClicked($event)" (edit)="editResevation($event)" (delete)="cancelReservationConfirmation($event)"
    [source]="source" [settings]="settings2"></angular2-smart-table>
</div>
