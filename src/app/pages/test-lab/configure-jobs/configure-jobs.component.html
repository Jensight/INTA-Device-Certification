<div *ngIf= "!jiraDataLoaded" style="padding-right:20px; padding-left:25px;position:relative; height:400px">
  <div style="position: absolute;top: 40%;left: 50%;" class="lds-hourglass"></div>
</div>
  <div *ngIf= "jiraDataLoaded" style=" overflow: auto !important;">
<div class="row col-sm-12" style="width: 100%;text-align: right; position: absolute !important; z-index: 10 !important; top: -62px;">
  <button class="addButton" (click)="addNewJob()" title="Add New Job for Parallel Execution"
    style="z-index: 100; height: 30px;margin-bottom: -10px;margin-right: 10px; position: fixed !important;
    right: 197px; top: 60px;" *ngIf="jobList.length < 10">
    Add JOB-{{jobList.length + 1}}
  </button>
  <button *ngIf="jobList.length > 1" class="deleteButton" (click)="deleteJob()" title="Delete Current Job"
    style="z-index: 100; height: 30px;margin-bottom: -10px; position: fixed !important;
    right: 97px; top: 60px;">
    Delete JOB-{{activeTab + 1}}
  </button>
  <button class="ibutton"
    style="z-index: 100; height: 30px;margin-top: 10px;margin-bottom: -10px; visibility: hidden; position: fixed;">
  </button>
</div>
<div class="container-fluid">
  <div>
    <mat-tab-group  #tabGroup (selectedTabChange)="tabChanged($event)" [(selectedIndex)]="activeTab">
      <mat-tab *ngFor="let job of jobList;let i = index" [label]="i">
        <ng-template mat-tab-label>
          <span>
            Job-{{i+1}}
          </span>
          <span class="badge" [ngStyle]="{'color': validationList[i]  ? '#60af20':'#b00020', 'left': validationList[i]  ? '65%':'45%'}"
          >{{validationList[i]?'valid':'Data Empty'}}
        </span>
        </ng-template>
        <app-select-testcases [activeTab]="activeTab" [selectedTestbezds]="selectedTestbeds"
          [selectedDevices]="selectedDevices" [jobIndex]="i" (isValid)="isValid($event)" [updateJira]="updateJira" #selectTestCase>
        </app-select-testcases>
      </mat-tab>
    </mat-tab-group>

    <div class="row" style="padding:15px;margin-left: 0px;margin-right: 0px; ">
      <div class="col-lg-5"> 
        <div class="row">
          <div class="col-lg-12" >
            <mat-checkbox *ngIf="automated_mail_flag == true" style="margin-right: 20px" [(ngModel)]="automatedMail">Automated Mail</mat-checkbox>
            <mat-checkbox *ngIf="jira_option_flag == true" [(ngModel)]="updateJira" style="margin-right: 10px" (click)="checkJiraTeam()">Update Jira Test Execution</mat-checkbox>
            <!-- <span *ngIf="updateJira == true" [style.visibility]="!updateJira ? 'hidden': 'visible'">
               <mat-form-field appearance="outline" style="width:300px !important; font-size:12px;">
                 <input matInput  placeholder="Jira Execution Cycle Id"  [(ngModel)]="executionIdUpdate"  />
              </mat-form-field>
              <mat-icon matTooltip="Enter the Jira Execution Cycle Id if you want to update an existing cycle. Leave it empty to create a new one." style="cursor: pointer;">info</mat-icon>
              <mat-error *ngIf="!executionIdValid">
                Invalid Jira Execution Cycle Id
              </mat-error>
            </span> -->
            <br>
            <span *ngIf="jira_option_flag == true && jira_project_id_flag == false && updateJira == true" style="color: red; font-size:12px">
              Project ID is not added for this Team, Please check system config in setting.
            </span>
            <!-- <span *ngIf="user_valid_emailId == false && updateJira == true" style="color: red; font-size:12px">
              User does not have valid email id, Please check user details in setting.
            </span> -->
          </div>
          </div>
      </div>
      <div class="col-lg-7 text-right">
        <button type="button" class="btn btn-success"[disabled]="disableRegressionButton == false" (click)="scheduleNow()" title="Execute tests for selected setup"
          style="margin-right: 10px;">Schedule Now</button>

        <button type="button" class="btn btn-info" [disabled]="disableScheduleLater == false" (click)="scheduleLater()" title="Schedule at different time"
          style="margin-right: 10px;">Schedule Later</button>

        <button type="button" class="btn " (click)="checkTestbedsStatus()" routerLink="/pages/dashboard" status="warning" size="small" title="Return to Dashboard"
          style="margin-right: 10px; color:white; background-color: #ffaa00;" >Cancel</button>
      </div>
    </div>
  </div>
  </div>
  </div>
<!-- </div> -->
