<app-title-display ></app-title-display>
<div class="card col-md-9 offset-md-1 text-center" style="border-radius: 4%">

    Edit Team
  </h3>

        <mat-label>Team Name</mat-label>
        <input (keyup)="validateTeamName()" (blur)="validateTeamName()" matInput formControlName='name'>
        <mat-error *ngIf="editTeamForm.get('name').hasError('required')">
          Please Enter a Team Name
        </mat-error>
        <mat-error *ngIf="editTeamForm.get('name').hasError('unique')">
          Team Already Registered.
        </mat-error>
      </mat-form-field>
