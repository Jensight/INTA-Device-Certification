    <!-- Table -->
    <mat-card>
      <div class="d-flex justify-content-end align-items-center" >
        <button (click)="addErrorCodes()" class="mb-2" class="ibutton"> Add Error Code</button>
        <button mat-button color="warn" class="ml-1" (click) ="saveErrorCodeToExcel()" title="Download CSV Report For Error Codes" style="font-size: 16px;" >
          <i class="fa fa-download fa-1x" aria-hidden="true"></i>
        </button>
      </div>
     
        <angular2-smart-table (edit)="editErrorCode($event)" (delete)="deleteErrorCode($event)"
          [settings]="settings" [source]="source">
        </angular2-smart-table>
    </mat-card>
  </div>
