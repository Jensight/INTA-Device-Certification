<div class="col-lg-12 text-center" style="padding: 4.1px;">
    <!-- Add Error Fields -->
    <!-- <mat-card> -->
      <div class="col-md-11 text-center" style="margin-bottom: 20px">
        <h6 style="position: relative; top: 15px;">{{formType=="ADD"?"Add Error Code":"Edit Error Code"}}</h6>
    </div>
      <div class="col-md-2"></div>
      <div class="col-12" style="font-size: 14px;">
        <form [formGroup]="errorCodes" (ngSubmit)="updateErrorCodes()" style="position: relative; bottom: 6px;">
          <mat-form-field class="col-md-12">
            <mat-label>Error Code</mat-label>
            <input matInput formControlName="errorCode">
            <mat-error *ngIf="errorCodes.get('errorCode').hasError('required')">
              Please Enter Error Code
            </mat-error>
            <mat-error *ngIf="errorCodes.get('errorCode').hasError('duplicate')">
              Error Code Already Exists
           </mat-error>
          </mat-form-field>
          <mat-form-field class="col-md-12">
            <mat-label>Error Details</mat-label>
            <input matInput formControlName="errorDesc">
            <mat-error *ngIf="errorCodes.get('errorDesc').hasError('required')">
              Please Enter Error Details
            </mat-error>
            <mat-error *ngIf="errorCodes.get('errorDesc').hasError('duplicate')">
              Error Details Already Exists
            </mat-error>
            
          </mat-form-field>

          <div class="col-md-12" style="text-align: center">
            <button class="ibutton"
              style="margin-right: 15px;" [disabled]="errorCodes.invalid"> {{formType =="ADD"?"ADD":"UPDATE"}} </button>
          </div>
        </form>		
      </div>
      <!-- <div class="col-md-2"></div> -->
    <!-- </mat-card> -->
  </div>
