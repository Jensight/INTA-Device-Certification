<div class="col-lg-12 text-center" style="padding: 0.1px;">
    <mat-card>
        <div class="col-md-2"></div>
        <div class="col-md-8 offset-md-2" style="margin-bottom: 20px; font-size: 14px;">
            <form [formGroup]="other_config" class="text-left">
                <!-- <div class="col-md-12" style="padding: 10px;">
                    <section class="example-section">
                        <mat-slide-toggle color="primary" formControlName="jira_option">Jira integration</mat-slide-toggle>
                    </section>
                </div> -->
                <div class="col-md-12" style="padding: 10px;">
                    <section class="example-section">
                        <mat-slide-toggle color="primary" formControlName="cpe_telemetry">CPE-Telemetry</mat-slide-toggle>
                    </section>
                    <!--<nb-toggle status="success" formControlName="cpe_telemetry">CPE-Telemontry</nb-toggle>
                    <mat-error *ngIf="other_config.get('cpe_telemetry').hasError('required')">
                        Please Select Cpe-Telemontory
                    </mat-error>-->
                </div>
                <div class="col-md-12" style="padding: 10px;">
                    <section class="example-section">
                        <mat-slide-toggle color="primary" formControlName="automated_mail">Automated Mail</mat-slide-toggle>
                    </section>
                    <!--<nb-toggle status="success" formControlName="cpe_telemetry">CPE-Telemontry</nb-toggle>
                    <mat-error *ngIf="other_config.get('cpe_telemetry').hasError('required')">
                        Please Select Cpe-Telemontory
                    </mat-error>-->
                </div>
                <div class="col-md-12" style="padding: 10px;">
                    <section class="example-section">
                        <mat-slide-toggle color="primary" formControlName="test_suite_popup">Test Suite In Popup</mat-slide-toggle>
                    </section>
                </div>
                <div class="col-md-12" style="padding: 10px;">
                    <section class="example-section">
                        <mat-slide-toggle color="primary" formControlName="add_error_codes">Add Error Codes</mat-slide-toggle>
                    </section>
                </div>
                <div class="col-md-12" style="padding: 10px;">
                    <mat-form-field class="col-md-12" style="width: 350px;">
                        <mat-label>Additional Time for Reservation (Value in mins)</mat-label>
                        <input matInput formControlName="additional_time_for_reservation_value">
                        <mat-error *ngIf="other_config.get('additional_time_for_reservation_value').hasError('required')">
                        Please Enter Additional Time for Reservation (Value in mins)
                        </mat-error>
                    </mat-form-field>
                </div>
            </form>
            <div class="col-md-12" style="text-align: center" >
                <button class="ibutton" (click)="setConfig()"
                  style="margin-right: 15px; width:100px;"> Save Config </button>
            </div>
        </div>
    </mat-card>
</div>
