<div class="row">
  <nav  class="col-md-5" aria-label="breadcrumb">
 <ol class="breadcrumb" style="background-color:#fafafa; padding-top:0px;">
   <li class="breadcrumb-item"><a href="#/pages/dashboard" style="color:red;text-decoration: none;font-size: medium;">Dashboard</a></li>
   <li class="breadcrumb-item active" style="color:rgba(0, 0, 0, 0.87);text-decoration: none;font-size: medium;">Add Team</li>
 </ol>
</nav>
</div>
<app-title-display ></app-title-display>
<div class="card col-md-9 offset-md-1 text-center" style="border-radius: 4%">
  <h3 style="margin:20px">
    Add Team
  </h3>
  <div style="margin-bottom: 20px">
    <form [formGroup]="addTeamForm" class="text-center">
      <mat-form-field style="width:300px;margin-right: 40px;margin-left: 40px">
        <mat-label>Team Name*</mat-label>
        <input (keyup)="validateTeamName()"
        class="input-user"
         (blur)="validateTeamName()"
          matInput formControlName='name'>
        <mat-error *ngIf="addTeamForm.get('name').hasError('required')">
          Please Enter a Team Name
        </mat-error>
        <mat-error *ngIf="addTeamForm.get('name').hasError('unique')">
          Team Already Registered.
        </mat-error>
      </mat-form-field>

          <mat-option value="D">Deactivated</mat-option>
        </mat-select>
        <mat-error *ngIf="addTeamForm.get('status').hasError('required')">
          Please select a Status
        </mat-error>
      </mat-form-field>

      <div class="text-center" style="padding-top: 3px;">
        <button [disabled]="!addTeamForm.valid" (click)="addTeam()" class="ibutton"
