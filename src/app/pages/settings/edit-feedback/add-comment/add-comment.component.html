<form [formGroup]="commentForm" style="margin: 10px;" >
    <div class="row">
      <div class="col-lg-11">
        
      </div>
      <div class="col-lg-1">
        <span (click)="dialogRef.close()" style="cursor:pointer" class="close" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </span>
      </div>
    </div>
  
    <div class="form-group" style="margin: 5px;">
      <label for="exampleFormControlTextarea1">Comments:</label>
      <textarea class="form-control" rows="8" formControlName="comment"></textarea>
      <span class="text-danger"
          *ngIf="(commentFormControl.comment.touched || submitted) && commentFormControl.comment.errors?.required">
          Please enter some Description.
      </span>
    </div>
    <button type="button" class="btn btn-primary pull-right" (click)="onSubmit()">Add Comment</button>
    
  </form>
