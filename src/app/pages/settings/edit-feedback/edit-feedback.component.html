<div class="row">
  <nav  class="col-md-5" aria-label="breadcrumb">
 <ol class="breadcrumb" style="background-color:#fafafa; padding-top:0px;">
   <li class="breadcrumb-item"><a href="#/pages/dashboard" style="color:red;text-decoration: none;font-size: medium;">Dashboard</a></li>
   <li class="breadcrumb-item active" style="color:rgba(0, 0, 0, 0.87);text-decoration: none;font-size: medium;">View Feedback</li>
 </ol>
</nav>

  <app-title-display style="margin-top:12px;" titleName="Feedback Edit View"></app-title-display></div>
<div class="row">
    <div class="col">
        <div class="card">
            <div class="card-body">
        <form [formGroup]="feedbackForm" >

          <div class="row">
            <div class="col">
                <div class="form-group">
                    <label for="exampleFormControlInput1">Page Name:</label>
                    <input type="text" class="form-control" placeholder="Pagename" formControlName="pageName" readonly>
                  </div>
                  <div class="form-group">
                      <label for="exampleFormControlTextarea1">Feedback Description:</label>
                      <textarea class="form-control" rows="6" formControlName="feedbackDescription" readonly></textarea>
                    </div>
            </div>
          </div>
            <div class="row">
                <div class="col">
                    <div class="form-group">
                        <label for="exampleFormControlSelect1">Priority:</label>
                        <select class="form-control" formControlName="priority">
                          <option value="High">High</option>
                          <option value="Medium">Medium</option>
                          <option value="Low">Low</option>
                        </select>
                        <span class="text-danger"
                            *ngIf="(registerFormControl.priority.touched || submitted) && registerFormControl.priority.errors?.required">
                            Please select Priority.
                        </span>
                      </div>
                </div>
                <div class="col">
                    <div class="form-group">
                        <label for="exampleFormControlSelect1">Status:</label>
                        <select class="form-control" formControlName="status">
                          <option value="Initiated">Initiated</option>
                          <option value="Development">Development</option>
                          <option value="Completed">Completed</option>
                        </select>
                        <span class="text-danger"
                            *ngIf="(registerFormControl.priority.touched || submitted) && registerFormControl.priority.errors?.required">
                            Please select Priority.
                        </span>
                      </div>
                </div>
            </div>
       
   
            <button type="button" *ngIf="userData.role ==='admin'" class="btn btn-primary pull-right" (click)="onSubmit()">Update</button>
            <button type="button" class="btn btn-primary pull-left" (click)="onBack()" > < Back </button>
          
          </form>
        </div>
        </div>
    </div>
<div class="col">
    <div class="card" style="height:445px; overflow-y: auto;">
      <div class="card-body">
        <div class="row d-flex justify-content-center">
          <div class="col-md-12">
              <div class="headings d-flex justify-content-between align-items-center mb-3">
                  <h6>All comments</h6>
              </div>
              <div class="">
                  <button type="button" class="btn btn-primary btn-sm btn-block" (click)="onComment()">+ Add Comment</button>
              </div>
              <div style="height:15px;">

              </div>

              <div class="card p-3 mt-2" *ngFor = "let comment of feedbackComments">
                  <div class="d-flex justify-content-between align-items-center">
                      <div class="user d-flex flex-row align-items-center"> 
                          <img src="assets/images/user.png" width="30" class="user-img rounded-circle mr-2"> 
                          <span><small class="font-weight-bold text-primary">{{ comment.createdby | usernameById: allUsers}}</small> 
                              
                          </span> </div> <small>{{comment.createdAt | dateAgoByDate}}</small>
                  </div>

                  <div class="action d-flex justify-content-between mt-2 align-items-center">
                      <div class="reply px-4"><small class="font-weight-bold">{{comment.comment}} </small> </div>
                      <div class="icons align-items-center"> <i class="fa fa-check-circle-o check-icon text-primary"></i> </div>
                  </div>
              </div>
          </div>
      </div>
      </div>
       
    </div>
</div>
</div>
