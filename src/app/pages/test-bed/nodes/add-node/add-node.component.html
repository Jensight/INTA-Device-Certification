<div class="row text-center" style="margin-top: 22px;">
  <div class="col-md-11 text-center" style="margin-bottom: 20px">
    <h3>Add Network Element</h3>
  </div>
  <span class="col-md-1" style="margin-left: -35px;">
    <span (click)="dialogRef.close()" style="cursor: pointer" class="close" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </span>
  </span>
</div>
<form [formGroup]="nodeForm" class="text-center" style="position: relative; bottom: 12px;">
  <div class="row">
    <div class="col-lg-12 text-left" style="padding-left: 35px;">
      <mat-checkbox  color="primary" 
      formControlName="elementType"
      (change)="showOptions($event)" >Device Profile</mat-checkbox>

    </div>
  </div>
  
  <mat-form-field style="width:300px">
    <mat-label>Network Element Name</mat-label>
    <input matInput formControlName='nodeName'>
    <mat-error *ngIf="nodeForm.get('nodeName').hasError('required')">
      Please Enter a Network Element Name
    </mat-error>
    <mat-error *ngIf="nodeForm.get('nodeName').hasError('duplicate')">
      Network Element Already Registered
    </mat-error>
  </mat-form-field>
 
    
  <mat-form-field style="width:300px" [hidden]="isProfileIdHidden">
    <mat-label>Device Profile</mat-label>
    <mat-select formControlName="profileId" >
      <mat-option *ngFor="let item of allProfiles" [value]="item._id">{{item.profileName}}</mat-option>
    </mat-select>
    <mat-error *ngIf="nodeForm.get('profileId').hasError('required')">
      Please selecte a Profile
    </mat-error>
  </mat-form-field>
  <div class="text-center">
    <button class="ibutton" style="margin-right: 15px; height: 32px; width:50px;" [disabled]="!nodeForm.valid"
      (click)="addNode()">Add</button>
    <button class="ibutton" style="height: 32px; width:70px" (click)="cancel()">Cancel</button>
  </div>
</form>
