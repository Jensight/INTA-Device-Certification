<div class="d-flex justify-content-end align-items-center mt-2 mr-3">
    <button (click)="addTestBed()" class="ibutton" style="width:110px;" [disabled]="permissionDenied"> Add Testbed</button>
    <section style="margin-left: 10px; display: flex; padding-top: 8px;">
        <mat-slide-toggle color="primary" [(ngModel)]=toggleFlag (change)="toggleButtonChange()"
            checked>Active-Testbeds</mat-slide-toggle>
    </section>
</div>
<div class="">
    <div class=" text-center" style="padding:10px 15px 15px 15px;" >
        <angular2-smart-table (edit)="editTestBed($event)" (custom)="onCustom($event)" (delete)="deleteTestbedConfirmation($event)" (click)="setSortData()" [source]="source" [settings]="settings"></angular2-smart-table>
    </div>
</div>
