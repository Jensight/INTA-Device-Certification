<div class="row">
    <nav  class="col-md-5 px-0" aria-label="breadcrumb">
        <ol class="breadcrumb" style="background-color:#fafafa; padding-top:0px;">
            <li class="breadcrumb-item"><a href="#/pages/dashboard" style="color:red;text-decoration: none;font-size: medium;">Dashboard</a></li>
            <li class="breadcrumb-item active" style="color:rgba(0, 0, 0, 0.87);text-decoration: none;font-size: medium;">Vendor List</li>
        </ol>
    </nav>  
    <div class="col-md-6">
        <div class="d-flex">
            <app-title-display titleName="Vendor List"></app-title-display>
            <div style="padding-left: 25px; margin-top: -3px;">
                <span><i class="fa fa-question-circle-o" matTooltip="Available Vendor  listed under the module and Admin can able to manage Vendor's." 
                    style="font-size: 17px; color:#8e97a0; margin-left: -6px;"></i></span>
            </div>
        </div>
    </div>
</div>
<div class="card">
    <div style="font-size: .9375rem !important; padding-left: 20px; padding-top: 10px; padding-bottom: 10px; padding-right: 10px; font-weight: 400; line-height: 1.25rem;">
        <div class="d-flex justify-content-end align-items-center" >
            <button (click)="addVendor()" class="mb-2 ibutton"> Add Vendor</button>
        </div>
        <angular2-smart-table (delete)="deleteVendorConfirmation($event)" (edit)="editVendor($event)" (click)="setSortData()" [source]="source" [settings]="settings"></angular2-smart-table>
    </div>
</div>
