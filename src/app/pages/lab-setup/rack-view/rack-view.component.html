<div>
  <div class="text-right" style="padding-bottom: 5px; padding-top: 5px; padding-right: 10px;  background-color: #ffff;">
    <button type="button" class="btn btn-primary btn-sm" (click)="checkStatusForAllDevice()">
      Check Device
    </button>
  </div>

  <div class="cardcontainer" style="width: 100%; ">
    <div class="card" style=" max-height: 350px; overflow: scroll;">
      <div class="flex-row d-flex" style="padding-bottom: 2px; padding-left: 4px;padding-top: 5px; width:100%; "
        *ngFor="let self of labsetupArray; let s =index">
        <div class="col-xl-2 col-lg-3 col-sm-4 col-12" *ngFor="let row of self.rowSettings; let r =index">
          <div class="card mx-auto">
            <div class="card-content">
              <div class="card-body" *ngIf="row.deviceDetails && row.available == false; else elsePart">
                <div class="position-absolute top-right">
                  <span class="text-right">
                    <button type="button" class="btn btn-sm" *ngIf="!row.deviceDetails.available">
                      <i class="fa fa-lock" style="color: red;"></i>
                    </button>
                  </span>

                  <span style="font-size: 10px;">{{self.rackName}}-{{self.selfName}}-{{row.columnName}}</span>

                  <button type="button" class="btn btn-sm"
                    (click)="addsettings(self.rackName,self.selfName,row.columnName,row.deviceDetails)"><i
                      class="fa fa-cog fa-sm" style="color: grey"></i></button>
                </div>
                <div style="height: 5px;"></div>
                <div class="d-flex">
                  <div class="text-left">
                    <span class="deviceFont selfAvail"
                      [matTooltip]="row.deviceDetails.deviceName">{{row.deviceDetails.deviceName}}</span>
                  </div>
                </div>
                <div style="height: 10px;"></div>
                <!-- <div class="progress mt-1 mb-0" style="height: 7px;">
            <div class="progress-bar bg-primary" role="progressbar" style="width: 60%"
                aria-valuenow="80" aria-valuemin="0" aria-valuemax="100"></div>
          </div> -->
                <div class="d-flex">
                  <div class="position-absolute bottom-right">
                    <button type="button" class="btn btn-sm btn-outline-secondary changepadding"
                      (click)="rebootConfiermation(self, row, s, r)" data-toggle="tooltip" data-placement="bottom"
                      title="Reboot" [disabled]="!row.deviceDetails.available">
                      <i *ngIf="!row.loading1 || row.loading1 == false" class="fa fa-refresh"></i>
                      <i *ngIf="row.loading1 && row.loading1 == true" class="fa fa-spinner fa-pulse fa-x fa-fw"></i>
                      <span *ngIf="row.loading1 && row.loading1 == true" class="sr-only">Loading...</span>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary changepadding"
                      (click)="updateDeviceDetails(self, row, s, r)" data-toggle="tooltip" data-placement="bottom"
                      title="Update Device" [disabled]="!row.deviceDetails.available">
                      <i *ngIf="!row.loading2 || row.loading2 == false" class="fa fa-wrench" aria-hidden="true"></i>
                      <i *ngIf="row.loading2 && row.loading2 == true" class="fa fa-spinner fa-pulse fa-x fa-fw"></i>
                      <span *ngIf="row.loading2 && row.loading2 == true" class="sr-only">Loading...</span>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary changepadding"
                      (click)="checkDeviceStatus(self, row, s, r)" data-toggle="tooltip" data-placement="bottom"
                      title="Check Availability" [disabled]="!row.deviceDetails.available">
                      <i *ngIf="!row.loading || row.loading == false" [style]="row.color" class="fa fa-circle"
                        aria-hidden="true"></i>
                      <i *ngIf="row.loading && row.loading == true" class="fa fa-spinner fa-pulse fa-x fa-fw"></i>
                      <span *ngIf="row.loading && row.loading == true" class="sr-only">Loading...</span>
                    </button>
                  </div>
                </div>
              </div>
              <ng-template #elsePart>
                <div class="card-body">
                  <div class="position-absolute top-right">
                    <span style="font-size: 10px;">{{self.rackName}}-{{self.selfName}}-{{row.columnName}}</span>
                    <button type="button" class="btn btn-sm"
                      (click)="addsettings(self.rackName,self.selfName,row.columnName)"
                      [disabled]="row.available == false">
                      <i class="fa fa-cog fa-sm" style="color: grey"></i>
                    </button>
                  </div>
                  <div style="height: 5px;"></div>
                  <div class="d-flex">
                    <div class="text-center">
                      <span class="deviceFont selfEmpty" *ngIf="row.available == true">Empty</span>
                      <span class="deviceFont selfEmpty" *ngIf="row.available == false" style="color: grey">Already Used
                        By Other Team</span>
                    </div>
                  </div>
                  <div style="height: 10px;"></div>
                </div>
              </ng-template>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
