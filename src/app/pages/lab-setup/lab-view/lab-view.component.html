<div class="row col-sm-12" style="width: 100%;text-align: right; position: absolute !important; z-index: 10 !important; top: -62px;">
  <button class="addButton" (click)="setView('CTR')" title="CTR View"
    style="z-index: 100; height: 30px;margin-bottom: -10px;margin-right: 10px; position: fixed !important;
    right: 197px; top: 60px;">
    CTR View
  </button>
  <button class="addButton" (click)="setView('DTR')" title="DTR View"
    style="z-index: 100; height: 30px;margin-bottom: -10px; position: fixed !important;
    right: 97px; top: 60px;">
    DTR View
  </button>
  <!-- <button class="addButton" title="Overview" (click)="loadOverview()"
    style="z-index: 100; height: 30px; margin-bottom: -10px; position: fixed !important;
    right: 297px; top: 60px;">
    Overview
  </button> -->
</div>
<span *ngIf="!overView" >
<div class="container-fluid">
  <div>
    <mat-tab-group  #tabGroup (selectedTabChange)="rackChange($event, false)">
      <mat-tab *ngFor="let rack of filteredData;let i = index" [label]="rack.rackId">
        <ng-template mat-tab-label>
          <div class="tab-label-wrapper">
            <span class="rack-id-label">{{rack.rackId}}</span>
            <span class="badge" 
                  [matTooltip]="rack.rackId + ' - ' + rack.rackName" 
                  matTooltipPosition="below">{{rack.rackName}}</span>
          </div>
        </ng-template>
        <app-rack-view *ngIf="showRackView" [labsetupArray]='labsetupArray'></app-rack-view>
        <app-lab-row-view *ngIf="!showRackView" [labsetupArray]='labsetupArray' [viewType]="selectedConfig" [rackData]="rackData"></app-lab-row-view>
      </mat-tab>
    </mat-tab-group>
    <div *ngIf="!filteredData || filteredData.length === 0" style="text-align: center; padding: 60px 20px; color: #888; font-size: 18px;">
      No Data Available, Please Configure Labsetup Details.
    </div>
  </div>
  </div>
</span>
<span *ngIf="overView">
  <app-lab-overview></app-lab-overview>
  </span>
