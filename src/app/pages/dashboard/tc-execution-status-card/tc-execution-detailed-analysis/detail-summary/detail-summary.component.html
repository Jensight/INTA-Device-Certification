
<table mat-table #outerSort="matSort" [dataSource]="dataSource" multiTemplateDataRows class="mat-elevation-z8" matSort>
	<ng-container matColumnDef="{{column}}" *ngFor="let column of columnsToDisplay">
		<th mat-header-cell *matHeaderCellDef mat-sort-header> {{columnNamesToDisplay[column]}} </th>
		<td mat-cell *matCellDef="let element" (click)="toggleRow(element, column)">
		  <!-- Show 0 for abortTC and warnTC if value is null/undefined/empty -->
		  <ng-container *ngIf="column === 'abortTC' || column === 'totalAbort'">
		    {{ element[column] != null && element[column] !== '' ? element[column] : 0 }}
		  </ng-container>
		  <ng-container *ngIf="column === 'warnTC' || column === 'totalWarn'">
		    {{ element[column] != null && element[column] !== '' ? element[column] : 0 }}
		  </ng-container>
		  <ng-container *ngIf="column === 'jiraKey' && element[column]">
			<a [href]="jira_domain+'/browse/'+element[column]" target="_blank">
                                {{element[column]}}</a>
		  </ng-container>
		  <ng-container *ngIf="column === 'jiraKey' && !element[column]">
			<span> - </span>
		  </ng-container>
		  <ng-container *ngIf="column !== 'abortTC' && column !== 'totalAbort' && column !== 'warnTC' && column !== 'totalWarn'
		   && column !== 'jiraKey'">
		    {{element[column]}}
		  </ng-container>
		</td>
	</ng-container>

	<!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
	<ng-container matColumnDef="expandedDetail">
		<td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplay.length">
			<div class="example-element-detail" *ngIf="element.modelFWVersion?.data.length" [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'">
				<div class="inner-table mat-elevation-z8" *ngIf="expandedElement">
          <!-- <mat-form-field>
            <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filter">
          </mat-form-field> -->
          <table style="margin: 10px 0; border: 1px solid #ebebeb;"  #innerTables mat-table #innerSort="matSort" [dataSource]="element.modelFWVersion" matSort>
            <ng-container matColumnDef="{{innerColumn}}" *ngFor="let innerColumn of innerDisplayedColumns">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> {{innerColumn}} </th>
              <td mat-cell style="word-break: break-all !important;" *matCellDef="let element"> {{element[innerColumn]}} </td>
            </ng-container>
            <tr mat-header-row class="innerTableRow" *matHeaderRowDef="innerDisplayedColumns"></tr>
            <tr mat-row class="innerTableRow" *matRowDef="let row; columns: innerDisplayedColumns;"></tr>
          </table>
		  <div *ngIf="element.modelFWVersion.data.length > 5"> <mat-paginator #paginator1 [pageSizeOptions]="[5, 10, 15, 20]"></mat-paginator> </div>
				</div>
			</div>
		</td>
	</ng-container>

	<tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
	<tr mat-row *matRowDef="let element; columns: columnsToDisplay;" [class.example-element-row]="element.modelFWVersion?.data?.length"
	 [class.example-expanded-row]="expandedElement === element" class="alternate-bg" >
	</tr>
	<tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
</table>
<mat-paginator #paginator [pageSizeOptions]="[5, 10, 15, 20]"></mat-paginator>
