<div class="card" style="cursor: move;">
  <div class="card-body">
    <div class="slide-num">

      <div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <h3 style="padding-top: 20px;">{{number}}</h3>
            <p>Passed Testcases</p>
          </div>

          <div class="carousel-item">
            <h3 style="padding-top: 20px;">{{failNumber}}</h3>
            <p>Failed Testcases</p>
          </div>

          <div class="carousel-item">
            <h3 style="padding-top: 20px;">{{noRunNumber}}</h3>
            <p>No Run Testcases</p>
          </div>

        </div>
        <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
          <i class="fa fa-chevron-left" aria-hidden="true"></i>
        </a>
        <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
          <i class="fa fa-chevron-right" aria-hidden="true"></i>
        </a>
      </div>
    </div>
    <a href="javascript:void(0)" (click)="redirect()" class="card-btn">Execution Analysis<strong><i class="fa fa-chevron-right"
          aria-hidden="true"></i></strong></a>
  </div>
  <div *ngIf="isEnableLatestInfo" class="card-foot">
    <p>Last Execution <strong><i class="fa fa-chevron-up" aria-hidden="true"></i>
      </strong></p>
    <h6 style="font-weight: 600 !important; font-size: 14px !important;">{{(timeDifference|limitTo:20) || 'NA'}}</h6>
  </div>
</div>
