<div>
    <app-title-display [breadcrumbs]="breadcrumbs" titleName="Environment Analysis"></app-title-display>
    <mat-card style="padding-top:0px;min-height: 500px">
        <div class="d-flex justify-content-between align-items-center pt-2">
            <div class="text-right">
                <!--<mat-form-field appearance="fill">
                    <mat-label>Selecct Platform</mat-label>

                        </mat-option>
                    </mat-select>
                </mat-form-field>-->
                <mat-form-field appearance="fill">
                    <mat-label>Selecct Platform</mat-label>
                    <mat-select [(ngModel)]="platformType" (selectionChange)="saveplatform(platformType)" multiple>
                        <div style="margin-right: 5px; margin-left: 5px;" class="text-right" *ngIf="platformType.length == 0" >
                            <span style="color: red; font-size: 10px;">Please select Platform</span>
                        </div>   
                        <mat-option *ngFor="let plt of allPlatform" [value]="plt.id">{{plt.deviceName}}</mat-option>
                    </mat-select>
                    <div style="margin-right: 5px; margin-left: 5px;" class="text-right" *ngIf="platformType.length == 0" >
                        <span style="color: red; font-size: 10px;">Please select Platform</span>
                    </div> 
                </mat-form-field>
            </div>
            <div class="text-right">
                <!--<mat-form-field appearance="fill">
                    <mat-label>Available App Version</mat-label>
                    <mat-select (selectionChange)="savefirmwareversion(selectedFirmware);" [(ngModel)]="selectedFirmware">
                        <mat-option [value]="''">All </mat-option>
                        <mat-option *ngFor="let firm of firmwareVersion" [value]="firm">
                            {{firm}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>-->
                <mat-form-field appearance="fill">
                    <mat-label>Available App Version</mat-label>
                    <mat-select [(ngModel)]="selectedFirmware"  multiple>
                        <mat-option *ngFor="let firm of firmwareVersion" [value]="firm">{{firm}}</mat-option>
                        <div class="text-right" *ngIf="firmwareVersion.length > 0" style="margin-right: 5px; margin-bottom: 5px;">
                            <button class="btn btn-success btn-sm" style="margin-right: 5px;" (click)="savefirmwareversion('true')">Submit</button>
                            <button class="btn btn-danger btn-sm" (click)="savefirmwareversion('false')">Clear</button>

                        </div>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="d-flex justify-content-between text-left" >
                <mat-form-field appearance="fill">
                    <mat-label>Enter a date range</mat-label>
                    <mat-date-range-input [formGroup]="range" [rangePicker]="picker">
                        <input matStartDate formControlName="start" placeholder="Start date">
                        <input matEndDate formControlName="end" placeholder="End date">
                        <mat-date-range-picker #picker>
                            <mat-date-range-picker-actions>
                                <button mat-button matDateRangePickerCancel>Cancel</button>
                                <button (click)="onSave()" mat-raised-button color="primary"
                                    matDateRangePickerApply>Apply</button>
                            </mat-date-range-picker-actions>
                        </mat-date-range-picker>
                    </mat-date-range-input>
                    <!-- <mat-hint>MM/DD/YYYY – MM/DD/YYYY</mat-hint> -->
                </mat-form-field>
                <div>
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-date-range-picker #picker></mat-date-range-picker>
                </div>
            </div>
            <div class="col-sm-2" *ngIf="!noData">
                <button (click)="capture('excel')" title="Download Excel Report"  class="btn btn-success btn-icon fixed-button" style="margin-left:5px;z-index: 100; height: 40px; float: right; width:40px">
                    <i class="fa fa-file-excel-o"></i>
                </button>
                &nbsp;&nbsp;
                <button class="ibutton" (click)="capture('pdf')" title="Download PDF Report" style="z-index: 100; height: 40px; float: right; width:40px;  " class="btn btn-danger btn-icon fixed-button" >
                    <i class="fa fa-file-pdf-o fa-lg" ></i>
                 </button>
            </div>
        </div>

            </div>
        </div>-->
        <div >

                    <div *ngIf="summaryTableReady" class="ngTable" style="width: 100%;">

            <div #screen2>
                <div *ngIf="!noData" class="row top-buffer text-center" >
                    <!--<div *ngIf="tableReady" class="ngTable">
                        <angular2-smart-table [source]="source" [settings]="regressionDataSettings"></angular2-smart-table>
                    </div>-->
                    <div class="example-header" style="margin-left: 20px;">
                        <mat-form-field>
                          <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filter">
                        </mat-form-field>
                    </div>

                    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">
                        <!--- Note that these columns can be defined in any order.
                              The actual rendered columns are set as a property on the row definition" -->
                        <!-- Position Column -->
                        <ng-container matColumnDef="usecase-id">
                            <th mat-header-cell *matHeaderCellDef>Usecase ID</th>
                            <td mat-cell *matCellDef="let element"> {{element.tcId}} </td>
                        </ng-container>
                        
                        <ng-container matColumnDef="usecase-name"  >
                            <th mat-header-cell *matHeaderCellDef> Usecase Name </th>
                            <td mat-cell style="text-align: initial !important; height: 3em;
                            overflow: hidden; text-overflow: ellipsis; width: 34%;" *matCellDef="let element"> {{element.tcName}} </td>
                        </ng-container>
                      
                        <span *ngFor="let ev of typePer">
                            <ng-container [matColumnDef]="ev.type">
                                <th mat-header-cell *matHeaderCellDef> {{ev.type}} <span *ngIf="ev.pers">({{ev.pers}})</span></th>
                                <td mat-cell *matCellDef="let element">
                                    <span *ngIf="element[ev.type] !== 'Not Executed'">
                                        <span class="col-6">{{element[ev.type]}}</span>
                                        <span class="col-6" >
                                            <i *ngIf="element[ev.type + '_last_Execution'] == 'Pass'" class="fa fa-check" style="color:green; font-size: 20px;" aria-hidden="true"></i>
                                            <i *ngIf="element[ev.type + '_last_Execution'] == 'Fail'" class="fa fa-times" style="color:red; font-size: 20px;" aria-hidden="true"></i>
                                        </span>
                                    </span>
                                    <span *ngIf="element[ev.type] == 'Not Executed'">
                                        {{element[ev.type]}}
                                    </span>
                                </td>
                            </ng-container>
                        </span>
                        <!--<ng-container matColumnDef="production_build">
                            <th mat-header-cell *matHeaderCellDef> Production Build <span *ngIf="typePer[0]">({{typePer[0].pers}})</span></th>
                            <td mat-cell *matCellDef="let element">
                                <span *ngIf="element['Production Build'] !== 'Not Executed'">
                                    <span class="col-6">{{element['Production Build']}}</span>
                                    <span class="col-6" >
                                        <i *ngIf="element['Production Build_last_Execution'] == 'Pass'" class="fa fa-check" style="color:green; font-size: 20px;" aria-hidden="true"></i>
                                        <i *ngIf="element['Production Build_last_Execution'] == 'Fail'" class="fa fa-times" style="color:red; font-size: 20px;" aria-hidden="true"></i>
                                    </span>
                                </span>
                                <span *ngIf="element['Production Build'] == 'Not Executed'">
                                    {{element['Production Build']}}
                                </span>
                            </td>
                        </ng-container>
                      
                        <ng-container matColumnDef="test_build_on_production">
                            <th mat-header-cell *matHeaderCellDef> Test Build on Production <span *ngIf="typePer[1]">({{typePer[1].pers}})</span></th>
                            <td mat-cell *matCellDef="let element">
                                <span *ngIf="element['Test Build on Production'] !== 'Not Executed'">
                                    <span class="col-6">{{element['Test Build on Production']}}</span>
                                    <span class="col-6" >
                                        <i *ngIf="element['Test Build on Production_last_Execution'] == 'Pass'" class="fa fa-check" style="color:green; font-size: 20px;" aria-hidden="true"></i>
                                        <i *ngIf="element['Test Build on Production_last_Execution'] == 'Fail'" class="fa fa-times" style="color:red; font-size: 20px;" aria-hidden="true"></i>
                                    </span>
                                </span>
                                <span *ngIf="element['Test Build on Production'] == 'Not Executed'">
                                    {{element['Test Build on Production']}}
                                </span>
                            </td>
                        </ng-container>
                      
                        <ng-container matColumnDef="test_build_on_pre_production">
                            <th mat-header-cell *matHeaderCellDef> Test Build on Pre-Production <span *ngIf="typePer[2]">({{typePer[2].pers}})</span></th>
                            <td mat-cell *matCellDef="let element">
                                <span *ngIf="element['Test Build on Pre-Production'] !== 'Not Executed'">
                                    <span class="col-6">{{element['Test Build on Pre-Production']}}</span>
                                    <span class="col-6" >
                                        <i *ngIf="element['Test Build on Pre-Production_last_Execution'] == 'Pass'" class="fa fa-check" style="color:green; font-size: 20px;" aria-hidden="true"></i>
                                        <i *ngIf="element['Test Build on Pre-Production_last_Execution'] == 'Fail'" class="fa fa-times" style="color:red; font-size: 20px;" aria-hidden="true"></i>
                                    </span>
                                </span>
                                <span  *ngIf="element['Test Build on Pre-Production'] == 'Not Executed'">
                                    {{element['Test Build on Pre-Production']}}
                                </span>
                            </td>
                        </ng-container>-->
                        
                        <tr mat-header-row style="font-size:14px; font-weight: bold;text-align: center;" *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>
                    <mat-paginator style="width: 100%;" [length]="resultsLength" [pageSizeOptions]="[10, 20, 50, 100]" [pageSize]="10"
                        aria-label="Select page of periodic elements">
                    </mat-paginator>
                </div>
            </div>

            <div class="text-center" *ngIf="loading == true">
                <mat-progress-bar mode="indeterminate"></mat-progress-bar>
                <!--<i class="fa fa-spinner fa-pulse fa-3x fa-fw"></i>
                <span class="sr-only">Loading...</span>-->
            </div>
            
            <div *ngIf="noData" class="row top-buffer">
               <div style="width: 100%; text-align: center;margin-top: 19%;">
                   <h4>No Regressions Found</h4>
               </div>
            </div>
        </div>
    </mat-card>
    
</div>
