<div *ngIf="!(dataService.CPERegressionNoData | async) && !loading && selectedYear" class="row">
  <div style="z-index: 100" class="col text-left">
    <button class="ibutton" (click)="goBackLevel()" title="View Model Data"
      style="z-index: 100; height: 30px; width: 70px">
      Back
    </button>
  </div>
  <div style="z-index: 100" class="col text-right">
    <button class="ibutton" (click)="downloadReport()" title="Download Report"
      style="z-index: 100; height: 30px; width:40px;">
      <i class="fa fa-download fa-lg"></i>
    </button>
  </div>
</div>
<div *ngIf="!(dataService.CPERegressionNoData | async) && !loading  && selectedYear"
  style="padding-right:20px; padding-left:25px;position:relative">
  <!--div style="position: absolute;top: 45%;right: 96%;z-index: 1;">
    <button [disabled]="!back" (click)="redirectPrevious()" mat-mini-fab color="primary">&laquo;</button>
  </div>
  <div style="position: absolute;top: 45%;left: 96%;z-index: 1;">
    <button [disabled]="!next" (click)="redirectNext()" mat-mini-fab color="primary">&raquo;</button>
  </div-->
  <div [@routeSlide]="state" class="row" style="padding:15px;margin-top:-20px">
    <div style="padding:10px" class="col-md-8">
      <div class="row">
        <div style="padding:10px" class="col text-center">
          <h4>{{selectedTypeName}} - {{selectedYear}} Monthly Summary</h4>
        </div>
      </div>
      <div echarts [options]="chartInput" style="width: 100%" (chartInit)="onChartInit($event)" class="echart"></div>
    </div>
    <div class="col-md-4">
      <div class="row">
        <div style="padding:10px" class="col text-center" *ngIf="!filteredMonth">
          <h4>Yearly Summary</h4>
        </div>
        <div style="padding:10px" class="col text-center" *ngIf="filteredMonth">
          <h4>Monthly Summary</h4>
        </div>
      </div>
      <div echarts [options]="chartInputPIE" style="width: 100%" (chartInit)="onChartInitPIE($event)" class="echart">
      </div>
    </div>
  </div>
</div>

<div *ngIf="loading" style="padding-right:20px; padding-left:25px;position:relative; height:400px">
  <div *ngIf="loading" style="position: absolute;top: 40%;left: 50%;" class="lds-hourglass"></div>
</div>

<div *ngIf="(dataService.CPERegressionNoData | async)"
  style="padding-right:20px; padding-left:25px;position:relative; height:400px">
  <div style="position: absolute;top: 40%;width:100%" class="text-center">
    <h4>No Data Available. Run Regressions and Come Back !!</h4>
    <br>
    <button routerLink="/pages/dashboard" title="Home"
      style="cursor: pointer;padding-bottom: 5px;padding-top:5px;padding-right:8px;padding-left:8px"
      class="btn btn-info btn-tiny">
      Home
    </button>
  </div>
</div>
