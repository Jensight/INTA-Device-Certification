<div class="card" style="cursor: move;">
  <div class="card-body">
    <div class="slide-num">
      <div id="cpeRegression" class="carousel slide" data-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <h3  style="padding-top: 20px;">{{deviceCount}}</h3>
            <p>Devices</p>
          </div>

          <div class="carousel-item">
            <h3  style="padding-top: 20px;">{{modelCount}}</h3>
            <p>Models</p>
          </div>

          <div class="carousel-item">
            <h3  style="padding-top: 20px;">{{vendorCount}}</h3>
            <p>Vendors</p>
          </div>

        </div>
        <a class="carousel-control-prev" href="#cpeRegression" role="button" data-slide="prev">
          <i class="fa fa-chevron-left" aria-hidden="true"></i>
        </a>
        <a class="carousel-control-next" href="#cpeRegression" role="button" data-slide="next">
          <i class="fa fa-chevron-right" aria-hidden="true"></i>
        </a>
      </div>
    </div>
    <a routerLink="/pages/dashboard/cpe-analysis" class="card-btn">View CPE Analysis <strong><i class="fa fa-chevron-right"
          aria-hidden="true"></i></strong></a>
  </div>
  <div *ngIf="isEnableLatestInfo" class="card-foot">
    <p>Last Device <strong><i class="fa fa-chevron-up" aria-hidden="true"></i>
      </strong></p>
      <h6 style="font-weight: 600 !important; font-size: 14px !important;" [matTooltip]="lastDevice || 'NA'">{{(lastDevice|limitTo:20) || 'NA'}}</h6>
  </div>
</div>
