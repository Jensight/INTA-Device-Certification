<div class="card" style="cursor: move;">
    <div class="card-body">
      <div class="slide-num">
  
        <div id="compareRegression" class="carousel slide" data-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active">
              <h3 style="padding-top: 20px;">{{weeklyCount }}</h3>
              <p>Weekly Regressions</p>
            </div>
  
            <div class="carousel-item">
              <h3 style="padding-top: 20px;">{{weeklyDuration | number:'1.1-2'}}</h3>
              <p>Weekly Duration({{weeklyUnits}})</p>
            </div>
  
            <div class="carousel-item">
              <h3 style="padding-top: 20px;">{{monthlyCount}}</h3>
              <p>Monthly Regressions</p>
            </div>

            <div class="carousel-item">
                <h3 style="padding-top: 20px;" [countUp]="monthlyDuration">{{monthlyDuration}}</h3>
                <p>Monthly Duration({{monthlyUnits}})</p>
              </div>
  
          </div>
          <a class="carousel-control-prev" href="#compareRegression" role="button" data-slide="prev">
            <i class="fa fa-chevron-left" aria-hidden="true"></i>
          </a>
          <a class="carousel-control-next" href="#compareRegression" role="button" data-slide="next">
            <i class="fa fa-chevron-right" aria-hidden="true"></i>
          </a>
        </div>
      </div>
      <a routerLink="/pages/dashboard/compare-regressions" class="card-btn">Compare now <strong><i class="fa fa-chevron-right"
            aria-hidden="true"></i></strong></a>
    </div>
    <div *ngIf="isEnableLatestInfo" class="card-foot">
      <p>Compare Regressions <strong><i class="fa fa-chevron-up" aria-hidden="true"></i>
        </strong></p>
      <h6 style="font-weight: 600 !important; font-size: 14px !important;">Compare last two regressions </h6>
    </div>
  </div>
