<div style="text-align:center; cursor: default;">
    <span class="badge badge-success" data-toggle="tooltip" title="Pass Testcase" style="margin-right: 5px;font-size:13px;">{{ passTC }}</span>
    <span class="badge badge-primary" data-toggle="tooltip" title="Norun Testcase" style="margin-right: 5px;font-size:13px;">{{ norunTC }}</span>
    <span class="badge badge-danger" data-toggle="tooltip" title="Fail Testcase" style="margin-right: 5px;font-size:13px;">{{ failTC }}</span>
    <span class="badge badge-warning" data-toggle="tooltip" title="Excluded Testcase" style="font-size:13px;color: white;">{{ excludedTC }}</span>
    <span class="badge badge-info" data-toggle="tooltip" title="Warning Testcase" style="margin-left: 5px;font-size:13px;">{{ warnTC }}</span>
    <span class="badge badge-secondary" data-toggle="tooltip" title="Aborted Testcase" style="margin-left: 5px;font-size:13px;">{{ abortTC }}</span>
</div>
