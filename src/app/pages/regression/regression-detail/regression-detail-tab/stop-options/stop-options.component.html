<div style="padding: 15px;">
    <div class="row">
        
        <div class="col-lg-12">
            <div>
                <!-- <mat-form-field  style="width:450px !important;">
                    <input matInput [(ngModel)]="data.name" name="tagname" placeholder="Regression Tag Name">
                </mat-form-field> -->
                <mat-radio-group [(ngModel)]="data.name" class="row">
                    <mat-radio-button style="padding-left:0px" class="col-md-12" value="stopImmediately">Do you want to abort immediately</mat-radio-button> 
                    <mat-radio-button style="padding-left:0px" class="col-md-12" value="stopGracefully" aria-checked="true" >Stop after graceful completion of current test case</mat-radio-button>                  </mat-radio-group>
            </div>

        </div>
    </div>
    <div class="row">
        <div class="col-lg-12 text-right"> 
            <button (click)="stop()" class="btn btn-success btn-demo ">Submit</button> &nbsp;&nbsp;
            <button (click)="close()" class="btn btn-danger btn-demo ">Cancel</button>
        </div>
        
    </div>

</div>
