<div #scrollMe style="width: 100%;
margin-top:10px;
max-height:275px;
border: 1px;
border-color: darkgrey;
border-style: solid;
border-radius: 4px;
max-height: 275px;
min-height: 275px;
margin-bottom: 20px;
overflow: auto"
    class="log">
    <div style="width:100%;" class="row">
        <div class="col-lg-12 text-center">
            <h6>Live Logs</h6>
        </div>
    </div>
    <div style="width:100%" *ngFor="let logs of liveLogs;let i=index" class="row">
        <div class="col-md-12">
            <div *ngIf="logs.mode =='log'" style="font-size:12px; " class="col-md-12">{{logs.value}}</div>
            <div *ngIf="logs.mode =='comment'" style="font-size:12px;" class="col-md-12"><span style="color: #6c757d; font-style: italic;">[comment] : {{logs.value}}</span></div>
            <div *ngIf="logs.mode =='highlight'" style="font-size:12px;" class="col-md-12">{{logs.datePrefix}}<span [ngStyle]="logs.style">{{logs.value}}</span></div>
            <div *ngIf="logs.mode =='img'" style="font-size:12px;" class="col-md-12">
                <u (click)="downloadImageForWholeRegression(logs.value)" style="color: blue;cursor: pointer;">{{logs.value}}</u><br>
                <img [id]="'image'+i" width="200" height="200" (click)="openInNextPage(logs.showvalue)" style="cursor: pointer;" /> <!--(click)="downloadImgnpm()"-->
            </div>
            <div *ngIf="logs.mode =='url'" style="font-size:12px;" class="col-md-12">{{logs.othertxt}}<a href="javascript:void(0)" (click)="selectingURL(logs.value);false">{{logs.value}}</a>{{logs.othertxt1}}</div>
        </div>
        
    </div>
</div>


<!-- [scrollTop]="scrollMe.scrollHeight" -->
