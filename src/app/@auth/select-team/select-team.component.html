<!-- New UI Desing -->
<nav class="navBar">
  <div class="px-2 d-flex justify-content-between align-items-center">
    <div class="logo">
      <img src="assets/images/logo.png" alt="Logo" />
    </div>
    <div class="text">
      <p class="mb-0 pr-2">Welcome, {{ username }}</p>
    </div>
  </div>
</nav>
<div class="teams-wrapper">
  <div class="background" id="background">
    <div class="card" *ngFor="let team of userTeams">
        <div class="content">
            <p class="card-title">{{team}}</p>
            <button (click)="selectingTeam(team)" type="submit" class="btn-round-info">Go ></button>
        </div>
    </div>
  </div>
</div>
